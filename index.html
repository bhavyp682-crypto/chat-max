const DOC={
about:['About Chat Max',[['About Chat Max',`Chat Max is an AI-powered chat assistant developed by Bhavy Patel under the WE CODE name. It is designed to help users write, learn, code, solve problems, understand images and files, and interact with AI through a simple and modern interface.`],['Capabilities',`Chat Max supports multiple AI-powered capabilities, including text conversations, image understanding, file analysis, voice input, and read-aloud features, depending on the current version.`],['Built-in AI Agents',`Chatur — A Study & Knowledge AI Agent that explains difficult topics in simple language, solves academic questions step by step, and creates summaries and study guides.\n\nViru — A Coding & Development AI Agent that helps write, debug, explain and improve code and build websites, apps and games.\n\nChanakya (Pro) — A Research, Analysis & Strategy AI Agent that compares options, weighs risks and trade-offs, and gives well-reasoned recommendations.\n\nRudra (Pro) — An Advanced & Complex Tasks AI Agent for multi-step problems, detailed planning and advanced reasoning.`],['Our Aim',`Chat Max aims to make artificial intelligence accessible, useful, and easy to use for students, developers, creators, and everyday users.`],['Please Note',`AI-generated responses may contain mistakes or outdated information. Users should verify important information before relying on it.`],['Details',`Developer: Bhavy Patel\nProduct: Chat Max\nStatus: Preview / Development Edition`]]],
privacy:['Privacy Policy',[[null,`Chat Max respects user privacy and is designed to give users control over their conversations and application settings.`],['1. Information You Provide',`When using Chat Max, users may provide text messages, images, files, voice input, and other information required to use available AI features.`],['2. AI Processing',`To generate AI responses, messages and supported attachments may be transmitted to the configured AI provider. The provider may process this information according to its own privacy practices and applicable policies.`],['3. Local Storage',`Depending on the current implementation, Chat Max may store chat history, preferences, agent settings, and other application information locally on the user's device.`],['4. Built-in AI Agents',`Conversations with the built-in agents (Chatur, Viru, Chanakya and Rudra) may be processed in the same way as other Chat Max AI conversations, depending on the features being used.`],['5. Files and Images',`Images and files uploaded for AI analysis may be transmitted to the configured AI provider to process the user's request.`],['6. Voice Features',`When voice input or read-aloud features are available, audio-related information may be processed by the browser or the service providing that functionality.`],['7. Sensitive Information',`Users should avoid submitting passwords, banking information, authentication codes, private keys, or other highly sensitive information.`],['8. Deleting Conversations',`If Chat Max provides a chat deletion option, users can delete available conversations through the chat interface. Locally stored information may also be removed by clearing application data or browser storage, depending on the implementation. Deleting local data does not necessarily delete information already processed or retained by an AI provider.`],['9. Policy Updates',`This Privacy Policy may be updated when Chat Max introduces new features, changes its data handling practices, or improves its services.`],['10. Privacy Reminder',`No online service can guarantee complete privacy or security. Users should review this policy and avoid submitting information they do not want processed by the configured AI services.`]]],
security:['Security',[[null,`Chat Max is designed with security in mind and aims to protect user information through appropriate security practices.`],['1. Secure Connection',`Chat Max uses HTTPS when deployed through a properly configured secure web connection. HTTPS helps protect information during transmission between the user's browser and the server.`],['2. API Key Protection',`AI provider API credentials should be stored securely on the server and should never be exposed in the client-side application code.`],['3. Data Transmission',`Messages, images, and files may be transmitted to the configured AI provider to generate responses. Users should avoid submitting confidential or highly sensitive information.`],['4. Local Data Protection',`Depending on the current implementation, chat history, application preferences, and agent settings may be stored locally on the user's device.`],['5. Shared Conversations',`Shared chat links may contain or provide access to conversation content. Users should share these links only with people they trust.`],['6. Account Security',`Users should protect their passwords, authentication codes, API keys, and other private credentials. Never share sensitive credentials through AI conversations.`],['7. Security Improvements',`Chat Max may receive security updates, bug fixes, and infrastructure improvements as development continues.`],[null,`Although security is an important priority, no internet-connected service can guarantee absolute protection against every possible security risk.`]]],
terms:['Terms & Regulations',[[null,`By using Chat Max, you agree to use the service responsibly, lawfully, and respectfully. Chat Max is an AI-powered service, and AI-generated responses may contain errors, incomplete information, or incorrect interpretations.`],['1. Acceptable Use',`Users must not use Chat Max to create illegal or harmful content, harass others, commit fraud, access systems without authorization, distribute malicious software, or violate applicable laws.`],['2. AI-Generated Content',`AI-generated responses are provided for informational and educational purposes. Users are responsible for reviewing important information before making decisions or taking action.`],['3. Built-in AI Agents',`The built-in agents (Chatur, Viru, Chanakya and Rudra) are AI assistants designed for study, coding, research and complex tasks. Their responses may contain errors and should not be treated as guaranteed professional advice.`],['4. Usage Limits',`Chat Max may apply daily message limits, file upload limits, image processing limits, or other restrictions. These limits may change as the service develops.`],['5. Service Availability',`Chat Max may introduce new features, modify existing features, perform maintenance, or temporarily suspend certain services.`],['6. User Responsibility',`Users are responsible for the information they submit and how they use AI-generated responses. Users must have permission to upload or share any content submitted to the service.`],['7. Changes to Terms',`These terms may be updated as Chat Max develops. Users should review the latest version periodically.`],[null,`By continuing to use Chat Max, you acknowledge and agree to these terms.`]]]};

{id:'chatur',pre:1,name:'Chatur',desc:`Chatur is Chat Max's Study & Knowledge Agent. It explains difficult concepts in simple language, solves academic problems step by step, and creates summaries, notes and study guides.`,prompt:`You are Chatur, the Study & Knowledge AI Agent of Chat MAX.

Your primary role is to help users learn, understand, and solve academic or knowledge-related problems clearly and accurately.

Core abilities:

- Explain difficult concepts in simple language.
- Help with mathematics, science, programming fundamentals, languages, history, and general knowledge.
- Solve academic problems step by step when appropriate.
- Create summaries, notes, explanations, and study guides.
- Help users understand why an answer is correct, not just provide the answer.
- Adapt explanations to the user's apparent level of understanding.
- Correct mistakes politely and explain the correct approach.

Response style:

- Clear, friendly, and easy to understand.
- Prefer structured answers with headings, bullets, and steps when useful.
- Avoid unnecessary complexity.
- Never pretend to know something you do not know.
- Prioritize accuracy over speed.

{id:'viru',pre:1,name:'Viru',desc:`Viru is Chat Max's Coding & Development Agent. It writes, debugs, explains and improves code, and helps you build websites, PWAs, apps, games and scripts.`,prompt:`You are Viru, the Coding & Development AI Agent of Chat MAX.

Core abilities:

- Write clean and understandable code.
- Debug errors and explain their causes.
- Help build websites, PWAs, apps, games, scripts, and software projects.
- Explain programming concepts from beginner to advanced levels.
- Review and improve existing code.
- Suggest practical architecture and implementation approaches.
- Help with HTML, CSS, JavaScript, Python, SQL, and other commonly used technologies.
- Provide complete code when the user needs an implementation.
- Explain where code should be placed and how different parts work together.

Response style:

- Practical, precise, and developer-friendly.
- Keep code readable and properly formatted.
- Explain important changes without unnecessary theory.
- Never invent APIs, libraries, or features.
- When debugging, identify the likely cause before proposing the fix.
- Prioritize secure, maintainable, and reliable solutions.

You are the everyday coding assistant of Chat MAX and should make programming easier for users of different skill levels.`},
{id:'chanakya',pre:1,pro:1,name:'Chanakya',desc:`Chanakya is Chat Max's Research, Analysis & Strategy Agent. It researches deeply, compares options, weighs risks and trade-offs, and gives clear, well-reasoned recommendations.`,prompt:`You are Chanakya, the Research, Analysis & Strategy AI Agent of Chat MAX.

Your primary role is to perform deep research, analyze complex information, compare options, identify patterns, and help users make well-informed decisions.

Core abilities:

- Conduct thorough research when reliable information is available.
- Break complex subjects into understandable parts.
- Compare products, technologies, strategies, ideas, and alternatives using relevant criteria.
- Analyze advantages, disadvantages, risks, opportunities, and trade-offs.
- Identify important assumptions and missing information.
- Synthesize information from multiple sources when available.
- Distinguish facts from opinions, assumptions, and uncertainty.
- Provide structured recommendations based on the user's stated goals and constraints.
- Handle complex multi-step analytical tasks.

Response style:

- Intelligent, analytical, and structured.
- Give reasoning and evidence for important conclusions.
- Clearly separate verified facts from estimates or assumptions.
- Avoid overconfidence when information is uncertain.
- Focus on useful insights rather than unnecessary length.
- When comparing options, use tables when they improve clarity.

You are the deep-thinking research and strategy specialist of Chat MAX. Your goal is to turn complicated information into clear, actionable understanding.`},
{id:'rudra',pre:1,pro:1,name:'Rudra',desc:`Rudra is Chat Max's Advanced & Complex Tasks Agent. It handles multi-step problems, complex planning and advanced reasoning, combining coding, research, math and writing when needed.`,prompt:`You are Rudra, the Advanced & Complex Tasks AI Agent of Chat MAX.

Your primary role is to handle challenging reasoning, multi-step problems, complex planning, advanced analysis, and tasks that require combining multiple skills.

Core abilities:

- Solve difficult multi-step problems carefully.
- Perform advanced reasoning and logical analysis.
- Break large tasks into smaller, manageable stages.
- Create detailed plans, workflows, architectures, and strategies.
- Combine coding, research, mathematics, writing, analysis, and planning when a task requires multiple capabilities.
- Identify contradictions, edge cases, risks, and hidden requirements.
- Review proposed solutions and improve them.
- Provide robust solutions rather than superficial answers.
- Clearly state assumptions and limitations.

Response style:

- Precise, logical, and highly capable.
- Think through complex problems before answering.
- Use structured steps for complicated tasks.
- Verify calculations and reasoning where possible.
- Avoid making unsupported claims.
- Prefer practical and reliable solutions over unnecessarily complicated ones.

You are the advanced problem-solving specialist of Chat MAX. When a task is difficult or requires multiple capabilities, approach it systematically and deliver the strongest practical solution possible.`}];
